<script>
(function(){
  /* ===== טופס פנייה =====
     W3F_KEY: מפתח הגישה של SplitForms (מפתח ציבורי, מיועד להופיע בקוד האתר). כשהוא ריק, הטופס נשלח בוואטסאפ. */
  var W3F_KEY='a129a8ecbb734ba0a2f54bb8c0047007';
  var WA='https://wa.me/972548315055?text=';
  /* מאיפה הגיע הגולש: קישור כמו /studio?src=ig מסמן את הפנייה, כדי לדעת אילו פרסומים מביאים פניות */
  var SRC_NAMES={ig:'אינסטגרם',fb:'פייסבוק',wa:'וואטסאפ',tt:'טיקטוק',li:'לינקדאין'};
  var SRC='';try{var q=new URLSearchParams(location.search);SRC=(q.get('src')||q.get('utm_source')||'').toLowerCase().replace(/[^a-z0-9_-]/g,'').slice(0,30);
    if(SRC)sessionStorage.setItem('ia.src',SRC);else SRC=sessionStorage.getItem('ia.src')||'';}catch(e){}
  var SRC_LABEL=SRC?(SRC_NAMES[SRC]||SRC):'';
  if(SRC_LABEL)[].forEach.call(document.querySelectorAll('a[href^="https://wa.me/972548315055?text="]'),function(a){
    try{var u=new URL(a.href);u.searchParams.set('text',(u.searchParams.get('text')||'')+' (דרך '+SRC_LABEL+')');a.href=u.toString();}catch(e){}});
  var f=document.getElementById('cform');if(f){
    var st=document.getElementById('cf-status'),btn=document.getElementById('cf-send');
    var F={name:document.getElementById('cf-name'),phone:document.getElementById('cf-phone'),email:document.getElementById('cf-email'),message:document.getElementById('cf-msg')};
    if(!W3F_KEY)btn.textContent='שליחה בוואטסאפ';
    function setErr(el,msg){var e=document.getElementById(el.id+'-e');e.textContent=msg||'';if(msg)el.setAttribute('aria-invalid','true');else el.removeAttribute('aria-invalid');return !msg;}
    function check(){var ok=true,first=null;
      function t(el,msg){if(!setErr(el,msg)){ok=false;if(!first)first=el;}}
      var n=F.name.value.trim(),p=F.phone.value.replace(/[^\d+]/g,''),m=F.email.value.trim(),g=F.message.value.trim();
      t(F.name,n.length<2?'כתבו את השם שלכם':'');
      t(F.phone,(p.replace(/\D/g,'').length<9)?'כתבו מספר טלפון תקין, למשל 050-1234567':'');
      t(F.email,(m&&!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(m))?'כתובת המייל לא נראית תקינה':'');
      t(F.message,g.length<5?'כתבו כמה מילים על הרעיון':'');
      if(first)first.focus();return ok;}
    Object.keys(F).forEach(function(k){F[k].addEventListener('input',function(){if(F[k].hasAttribute('aria-invalid'))setErr(F[k],'');});});
    function say(msg,cls){st.className='fstatus '+(cls||'');st.textContent='';st.appendChild(document.createTextNode(msg));}
    function waText(){return 'פנייה מהאתר של IA STUDIO\nשם: '+F.name.value.trim()+'\nטלפון: '+F.phone.value.trim()+(F.email.value.trim()?'\nמייל: '+F.email.value.trim():'')+'\n\n'+F.message.value.trim()+(SRC_LABEL?'\n\n(דרך '+SRC_LABEL+')':'');}
    function waFallback(msg){say(msg,'bad');var a=document.createElement('a');a.href=WA+encodeURIComponent(waText());a.target='_blank';a.rel='noopener';a.textContent=' לשליחה בוואטסאפ';st.appendChild(a);}
    f.addEventListener('submit',function(ev){ev.preventDefault();
      if(f.botcheck&&f.botcheck.checked)return; // מילוי של רובוט
      if(!check()){say('יש שדות שצריך לתקן.','bad');return;}
      if(!W3F_KEY){say('פותחים את וואטסאפ עם הפרטים שמילאתם. נשאר רק ללחוץ שם על "שליחה".','good');window.open(WA+encodeURIComponent(waText()),'_blank','noopener');return;}
      btn.disabled=true;var old=btn.textContent;btn.textContent='שולחים…';say('','');
      var data={subject:'פנייה חדשה מהאתר של IA STUDIO'+(SRC_LABEL?' · '+SRC_LABEL:''),from_name:'האתר של IA STUDIO',name:F.name.value.trim(),phone:F.phone.value.trim(),email:F.email.value.trim(),message:F.message.value.trim()};if(SRC_LABEL)data.source=SRC_LABEL;
      function attempt(){var body={access_key:W3F_KEY};for(var x in data)body[x]=data[x];
        return fetch('https://splitforms.com/api/submit',{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify(body)})
          .then(function(r){return r.text().then(function(t){var d=null;try{d=JSON.parse(t);}catch(e){}return {ok:!!(r.ok&&d&&d.success),info:(d&&d.message)?String(d.message):('HTTP '+r.status)};});});}
      function fail(msg,info){waFallback(msg);try{console.warn('contact form:',info);}catch(e){}}
      attempt().then(function(res){btn.disabled=false;btn.textContent=old;
          if(res.ok){f.reset();say('קיבלנו את הפנייה. נחזור אליכם בהקדם.','good');st.setAttribute('tabindex','-1');st.focus();}
          else fail('השליחה לא הצליחה. אפשר לנסות שוב, או',res.info);})
        .catch(function(e){btn.disabled=false;btn.textContent=old;fail('אין חיבור לשרת כרגע. אפשר לנסות שוב, או',String(e&&e.message||e));});
    });
  }

  /* ===== תפריט נגישות ===== */
  var root=document.documentElement,panel=document.getElementById('ax-panel'),ab=document.getElementById('ax-btn');if(!panel||!ab)return;
  var S={};try{S=JSON.parse(localStorage.getItem('ia.a11y')||'{}')||{};}catch(e){S={};}
  var ZL=['רגיל','גדול','גדול מאוד'];
  function apply(){root.classList.remove('ax-z1','ax-z2');if(S.z)root.classList.add('ax-z'+S.z);
    ['c','l','m','f'].forEach(function(k){root.classList.toggle('ax-'+k,!!S[k]);});
    [].forEach.call(panel.querySelectorAll('[data-ax]'),function(b){var k=b.getAttribute('data-ax');b.setAttribute('aria-pressed',k==='z'?String(!!S.z):String(!!S[k]));});
    document.getElementById('ax-zs').textContent=ZL[S.z||0];
    try{localStorage.setItem('ia.a11y',JSON.stringify(S));}catch(e){}
    dispatchEvent(new Event('resize'));}
  function open(v,from){panel.hidden=!v;ab.setAttribute('aria-expanded',String(v));if(v){panel.querySelector('button').focus();}else if(from!==false){ab.focus();}}
  ab.addEventListener('click',function(){open(panel.hidden);});
  var o2=document.getElementById('ax-open2');if(o2)o2.addEventListener('click',function(){open(true);});
  panel.addEventListener('click',function(e){var b=e.target.closest('[data-ax]');if(!b)return;var k=b.getAttribute('data-ax');if(k==='z')S.z=((S.z||0)+1)%3;else S[k]=!S[k];apply();});
  document.getElementById('ax-reset').addEventListener('click',function(){S={};apply();});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!panel.hidden)open(false);});
  document.addEventListener('click',function(e){if(!panel.hidden&&!panel.contains(e.target)&&!ab.contains(e.target)&&e.target.id!=='ax-open2')open(false,false);});
  apply();
})();
</script>
