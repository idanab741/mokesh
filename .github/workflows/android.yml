# בניית אפליקציית האנדרואיד של מוקש! (Capacitor, תיקיית mokesh-app) - קובץ AAB חתום, מוכן להעלאה ל-Google Play.
# אותה שיטה כמו בטריפלייס. מריצים ידנית מ-GitHub: Actions -> "Android build" -> Run workflow.
#
# Secrets נדרשים (Settings -> Secrets and variables -> Actions):
#   ANDROID_KEYSTORE_BASE64   - קובץ מפתח ההעלאה (upload key) בקידוד base64
#   ANDROID_KEYSTORE_PASSWORD - הסיסמה של הקובץ
#   ANDROID_KEY_ALIAS         - שם המפתח בתוך הקובץ (mokesh)
#   ANDROID_KEY_PASSWORD      - הסיסמה של המפתח
name: Android build

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "מספר גרסה (versionCode) - חייב להיות גבוה מהאחרון ב-Google Play. ריק = 100 + מספר ההרצה"
        required: false
      version_name:
        description: "שם גרסה (למשל 1.0.0)"
        required: false
        default: "1.0.0"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mokesh-app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        working-directory: mokesh-app
        run: npm ci --no-audit --no-fund

      - name: Sync Capacitor
        working-directory: mokesh-app
        run: npx cap sync android

      - name: Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          # בלי מפתח - בונים בלי חתימה (בדיקה שהבנייה עוברת). להעלאה ל-Google Play חייבים את ה-Secrets.
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then echo "::warning::אין ANDROID_KEYSTORE_BASE64 - בונים בלי חתימה (לא להעלאה)"; exit 0; fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build AAB
        working-directory: mokesh-app/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name || '1.0.0' }}
        run: |
          # סיסמה שהודבקה ל-Secret יכולה לכלול תווים נסתרים (סימן כיוון RTL, רווח, ירידת שורה) -> "Password is not ASCII".
          # מנקים כל מה שאינו תו ASCII נראה, ובודקים את המפתח עם keytool לפני הבנייה (נכשל תוך שנייה, לא אחרי 4 דקות).
          clean() { printf '%s' "$1" | LC_ALL=C tr -cd '\041-\176'; }
          for v in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            raw="${!v}"; fixed="$(clean "$raw")"
            if [ "$raw" != "$fixed" ]; then echo "::warning::$v הכיל תווים נסתרים/רווחים - נוקו"; fi
            [ -n "$fixed" ] && echo "::add-mask::$fixed"
            export "$v=$fixed"
          done
          if [ -n "$ANDROID_KEYSTORE_PATH" ]; then
            keytool -list -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null \
              || { echo "::error::הסיסמה ב-ANDROID_KEYSTORE_PASSWORD או השם ב-ANDROID_KEY_ALIAS לא תואמים לקובץ המפתח"; exit 1; }
            # טביעת האצבע (ציבורית) של מפתח ההעלאה - להשוואה מול מה ש-Google Play מציג/שלח במייל
            keytool -list -v -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" \
              | grep -E "SHA1:|SHA256:" | sed 's/^[[:space:]]*/::notice title=Upload key::/'
          fi
          export VERSION_CODE="${INPUT_VERSION_CODE:-$((GITHUB_RUN_NUMBER + 100))}"
          echo "versionCode=$VERSION_CODE"
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: mokesh-android-aab
          path: mokesh-app/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
