# בנייה של אפליקציית "מוקש!" לחנויות — בלי Mac.
# שתי עבודות: android-release (קובץ AAB לגוגל פליי) ו-ios-release (העלאה ל-TestFlight / App Store).
# ההוראות המלאות: mokesh-app/README.md

workflows:
  android-release:
    name: Android — Google Play
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      android_signing:
        - mokesh_upload        # שם המפתח שהעליתם ב-Codemagic (Code signing identities → Android keystores)
      node: 22
      java: 21
    triggering:
      events: []               # מריצים ידנית מתוך Codemagic
    scripts:
      - name: התקנת חבילות
        working_directory: mokesh-app
        script: npm ci
      - name: סנכרון Capacitor
        working_directory: mokesh-app
        script: npx cap sync android
      - name: בניית AAB חתום
        working_directory: mokesh-app/android
        script: ./gradlew bundleRelease   # מספר הגרסה = BUILD_NUMBER של Codemagic
    artifacts:
      - mokesh-app/android/app/build/outputs/bundle/release/*.aab

  ios-release:
    name: iOS — App Store
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: mokesh_asc   # שם מפתח ה-API שהוספתם ב-Codemagic (Team integrations → Developer Portal)
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.mokesh.game
      node: 22
      xcode: latest
    triggering:
      events: []
    scripts:
      - name: התקנת חבילות
        working_directory: mokesh-app
        script: npm ci
      - name: סנכרון Capacitor
        working_directory: mokesh-app
        script: npx cap sync ios
      - name: הגדרת חתימה
        script: xcode-project use-profiles
      - name: מספר גרסה
        working_directory: mokesh-app/ios/App
        script: agvtool new-version -all $BUILD_NUMBER
      - name: בניית IPA
        working_directory: mokesh-app/ios/App
        script: |
          xcode-project build-ipa --project App.xcodeproj --scheme App
    artifacts:
      - mokesh-app/ios/App/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
